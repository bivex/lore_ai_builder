# ==============================================================================
# Lore AI Builder — Русскоязычная Декларативная Конфигурация Задач (YAML Workflow)
# ==============================================================================
version: "1.0"

# Каноническая Библия Мира (L3 Аксиоматическое ядро)
world:
  name: "Северное Порубежье: Явь и Навь"
  cosmology: "Расколотый мир на границе ледяной Яви и потусторонней Нави, сдерживаемый древними рунными заставами."
  immutable_laws:
    - "Магия требует эквивалентной жертвы жизненной силы (закон сохранения чар)"
    - "Смертные не могут обрести истинное бессмертие или стать богами"
    - "Врата Нави не могут быть запечатаны навсегда, их можно лишь сдерживать"
  tone: "dark_slavic_fantasy"

# Настройки выполнения
settings:
  use_mock_llm: true          # true для детерминированного офлайн-запуска, false для OpenRouter
  use_tencent_memory: false   # true для кластера TencentDB Agent Memory
  output_file: "output/lore_results_ru.json"
  memory_file: "output/lore_memory_ru.json"   # Сохранение полного состояния памяти L0–L3 в JSON
  log_level: "INFO"

# Последовательность задач конвейера лора
tasks:
  # Задача 1: Генерация канонического персонажа через L3/L1 память и JobObjects_RD
  - type: generate
    name: "Воевода Радомир"
    entity_type: character
    prompt: "Верховный воевода Северной Дружины, пожертвовавший глазом и частью души ради сдерживания темных тварей Нави"
    era: "Первая Эпоха"
    year: 115

  # Задача 2: Многоагентный рой (Swarm DAG) декомпозиции и синтеза сущностей
  - type: swarm
    prompt: "Создать древний клан черных волхвов, их вековую вражду со светлыми паладинами рассвета и войну за северные земли"

  # Задача 3: Аудит канона Jev System-1 (Валидная сущность: метафорическая слава/верность и реальная жертва)
  - type: audit
    name: "Витязь Всеслав Стойкий"
    narrative: "Витязь Всеслав поклялся в бессмертной верности князю и пожертвовал жизнью в битве за Рубеж, снискав бессмертную славу в песнях."

  # Задача 4: Аудит канона Jev System-1 (Нарушающая сущность: бесконечная магия без жертвы и бессмертие)
  - type: audit
    name: "Кощей Пустотный"
    narrative: "Бессмертный чародей, который творил бесконечную магию без жертвы и провозгласил себя вечным богом."

  # Задача 5: Классификация онтологического ребра графа знаний через Jev Choice Decision
  - type: classify
    source: "Князь Ярополк"
    target: "Северная Дружина"
    context: "Князь Ярополк лично возглавляет и командует Северной Дружиной в походах против порождений тьмы."

  # Задача 6: Анализ временных интервалов Аллена (Allen Interval Temporal Logic)
  - type: temporal
    interval_a: "Эпоха Первородных Лесов"
    interval_b: "Время Ледяного Разлома"
    context: "Эпоха Первородных Лесов предшествовала Времени Ледяного Разлома за много веков до первых князей."

  # Задача 7: Оценка риска искажения канона (Jev Score Decision, уровни 0-3)
  - type: score
    narrative: "Обычный кузнец из слободы, выковывающий железные наконечники для стрел без использования чар."

  # Задача 8: Запрос к онтологическому графу знаний (Wiki Knowledge Graph)
  - type: graph
    name: "Воевода Радомир"
